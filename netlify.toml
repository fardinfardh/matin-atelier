# Static site — no build step. Netlify serves the repo root as-is
# and auto-detects the purchase-inquiry form in inquiry.html.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JS/CSS are not fingerprinted — revalidate so updates show immediately
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
