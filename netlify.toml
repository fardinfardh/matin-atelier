# Static site — no build step. Netlify serves the repo root as-is
# and auto-detects the purchase-inquiry form in inquiry.html.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
